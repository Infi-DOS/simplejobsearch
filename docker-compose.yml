services:
  web:
    build: .
    command: ["simplejobsearch", "web"]
    env_file: .env
    environment:
      JOBSEARCH_DB_PATH: /app/data/jobs.db
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  scheduler:
    build: .
    command: ["simplejobsearch", "scheduler"]
    env_file: .env
    environment:
      JOBSEARCH_DB_PATH: /app/data/jobs.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

